<style>
/* Layout: phone prototype on the left, judge-facing "Security Inspector" (simulated backend) on the right; stacks on phones. */

  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1020; --surface:#161B2D; --surface-2:#1D2338; --ink:#E8EBF3; --muted:#9AA2B8; --line:#2B3250;
  --brand:#8FA6FF; --brand-ink:#0C1020; --sos:#FF4D5E; --sos-ink:#1A0508; --ok:#3CC98A; --warn:#E5AE52; --sim:#B49BFF; --code-bg:#070A14; --code-ink:#C9D3F2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1020; --surface:#161B2D; --surface-2:#1D2338; --ink:#E8EBF3; --muted:#9AA2B8; --line:#2B3250;
  --brand:#8FA6FF; --brand-ink:#0C1020; --sos:#FF4D5E; --sos-ink:#1A0508; --ok:#3CC98A; --warn:#E5AE52; --sim:#B49BFF; --code-bg:#070A14; --code-ink:#C9D3F2; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:400px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
header.top{max-width:1180px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
header.top h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.01em;margin:0}

.tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid currentColor;line-height:1.4;white-space:nowrap}
.tag.sim{color:var(--sim)} .tag.ok{color:var(--ok)} .tag.warn{color:var(--warn)} .tag.sos,.tag.crit{color:var(--sos)} .tag.mut{color:var(--muted)}

/* Phone */
.phone{position:sticky;top:16px;width:100%;max-width:400px;margin:0 auto;border-radius:38px;border:10px solid #0B0E18;background:var(--surface);overflow:hidden;box-shadow:0 20px 50px rgba(10,14,30,.25)}

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const enc = new TextEncoder(), dec = new TextDecoder();
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const fmtTime = d => new Date(d).toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit",second:"2-digit",timeZone:"Africa/Johannesburg"});
const fmtDate = d => new Date(d).toLocaleString("en-ZA",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Africa/Johannesburg"});
function ctEqual(a,b){ if(a.length!==b.length) return false; let r=0; for(let i=0;i<a.length;i++) r|=a.charCodeAt(i)^b.charCodeAt(i); return r===0; }

async function hashPassword(pw, saltHex){
  const salt = saltHex ? Uint8Array.from(saltHex.match(/../g).map(h=>parseInt(h,16))) : rand(16);
  const key = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt, iterations:100000, hash:"SHA-256"}, key, 256);
  return {salt: hex(salt), hash: hex(bits)};
}

/* ---------- simulated backend + MySQL ---------- */
const SESSION_IDLE_MS = 3*60*1000;
const db = { users:[], contacts:[], alerts:[], sessions:{}, codes:{}, audit:[], evidence:[], deletions:[], requests:[], community:[], nextId:1 };

function audit(actor, action, result, sql){
  db.audit.unshift({t:Date.now(), actor, action, result, sql});
  if(db.audit.length>60) db.audit.pop();
  renderInspector();
}
class ApiError extends Error{ constructor(status,msg){ super(msg); this.status=status; } }

const api = {
  async _auth(token){
    const s = token && db.sessions[token];
    if(!s) throw new ApiError(401,"Not signed in");
    if(Date.now()-s.last > SESSION_IDLE_MS){ delete db.sessions[token]; throw new ApiError(401,"Session expired"); }
    s.last = Date.now();
    return db.users.find(u=>u.id===s.userId);
  },
  async register({name,email,password,pin}){
    await sleep(250);
    email = email.trim().toLowerCase();
    const exists = db.users.some(u=>u.email===email);
    if(exists){
      audit("anonymous","REGISTER duplicate email (no new account, same response shown)","allow","SELECT id FROM users WHERE email = ?  -- params: [hidden]");
      return {ok:true};
    }
    const {salt,hash} = await hashPassword(password);
    const pinH = await hashPassword(pin);
    const u = {id:db.nextId++, name, email, role:"user", salt, hash, pinSalt:pinH.salt, pinHash:pinH.hash, verified:false, failed:0, lockUntil:0, biometric:false};
    db.users.push(u);
    audit("anonymous",`REGISTER user #${u.id}`,"allow","INSERT INTO users (full_name, email, password_hash, salt, role) VALUES (?, ?, ?, ?, 'user')");
    this._issueCode(email);
    return {ok:true};
  },
  _issueCode(email){
    const code = String(crypto.getRandomValues(new Uint32Array(1))[0] % 1000000).padStart(6,"0");
    db.codes[email] = {code, exp:Date.now()+10*60*1000, tries:0, sentAt:Date.now()};
    S.inbox = {email, code, at:Date.now()};
  },
  async resend(email){
    const c = db.codes[email];
    if(c && Date.now()-c.sentAt < 30000) throw new ApiError(429,"Please wait 30 seconds before asking for another code.");
    if(db.users.some(u=>u.email===email && !u.verified)) this._issueCode(email);
    audit("anonymous","RESEND verification code","allow");
  },
  async verify(email, code){
    await sleep(200);
    const c = db.codes[email];
    if(!c || Date.now()>c.exp){ audit("anonymous","VERIFY expired/missing code","deny"); throw new ApiError(400,"This code has expired. Ask for a new one."); }
    c.tries++;
    if(c.tries>5){ delete db.codes[email]; audit("anonymous","VERIFY too many attempts","deny"); throw new ApiError(429,"Too many attempts. Ask for a new code."); }
    if(!ctEqual(c.code, code)){ audit("anonymous","VERIFY wrong code","deny"); throw new ApiError(400,"That code is not correct."); }
    const u = db.users.find(x=>x.email===email); u.verified = true; delete db.codes[email];
    audit(`user #${u.id}`,"VERIFY email","allow","UPDATE users SET email_verified = 1 WHERE id = ?");
    return {ok:true};
  },
  async login(email, password){
    await sleep(300);
    email = email.trim().toLowerCase();
    const u = db.users.find(x=>x.email===email);
    const generic = "Email or password is incorrect.";
    if(!u){ await hashPassword(password); audit("anonymous","LOGIN unknown email","deny","SELECT * FROM users WHERE email = ?"); throw new ApiError(401,generic); }
    if(u.lockUntil > Date.now()){
      const s = Math.ceil((u.lockUntil-Date.now())/1000);
      audit(`user #${u.id}`,"LOGIN blocked, account locked","deny");
      throw new ApiError(423,`Too many attempts. Try again in ${s} seconds.`);
    }
    const {hash} = await hashPassword(password, u.salt);
    if(!ctEqual(hash, u.hash)){
      u.failed++;
      if(u.failed>=5){ u.lockUntil = Date.now()+60000; u.failed=0; audit(`user #${u.id}`,"LOGIN 5th failure, locked 60 s","deny","UPDATE users SET locked_until = ? WHERE id = ?"); throw new ApiError(423,"Too many attempts. Your account is locked for 60 seconds."); }
      audit(`user #${u.id}`,`LOGIN wrong password (${u.failed}/5)`,"deny","UPDATE users SET failed_attempts = failed_attempts + 1 WHERE id = ?");
      throw new ApiError(401,generic);
    }
    if(!u.verified){ audit(`user #${u.id}`,"LOGIN email not verified","deny"); throw new ApiError(403,"Verify your email before signing in."); }
    u.failed = 0;
    return this._session(u,"password");
  },
  _session(u, how){
    const token = hex(rand(32));
    db.sessions[token] = {userId:u.id, created:Date.now(), last:Date.now()};
    audit(`user #${u.id}`,`LOGIN success (${how})`,"allow","INSERT INTO sessions (token_hash, user_id, expires_at) VALUES (?, ?, ?)");
    return {token, user:{id:u.id,name:u.name,email:u.email,role:u.role,biometric:u.biometric}};
  },
  async biometricLogin(deviceKey){
    await sleep(200);
    const u = db.users.find(x=>x.deviceKey && x.deviceKey===deviceKey && x.biometric);
    if(!u){ audit("anonymous","BIOMETRIC login, unknown device key","deny"); throw new ApiError(401,"Biometric sign-in is not set up on this phone."); }
    return this._session(u,"device biometric");
  },
  async logout(token){ const s=db.sessions[token]; if(s){ delete db.sessions[token]; audit(`user #${s.userId}`,"LOGOUT","allow","DELETE FROM sessions WHERE token_hash = ?"); } },
  async setBiometric(token, on, deviceKey){
    const u = await this._auth(token); u.biometric = on; u.deviceKey = on ? deviceKey : null;
    audit(`user #${u.id}`,`BIOMETRIC ${on?"enabled":"disabled"}`,"allow","UPDATE users SET biometric_enabled = ? WHERE id = ?");
  },
  async listContacts(token){
    const u = await this._auth(token);
    audit(`user #${u.id}`,"GET /contacts","allow","SELECT * FROM trusted_contacts WHERE user_id = ?");
    return db.contacts.filter(c=>c.userId===u.id);
  },
  async addContact(token, c){
    const u = await this._auth(token);
    const row = {...c, id:"c"+db.nextId++, userId:u.id}; db.contacts.push(row);
    audit(`user #${u.id}`,"POST /contacts","allow","INSERT INTO trusted_contacts (user_id, name, phone, relationship, method) VALUES (?, ?, ?, ?, ?)");
    return row;
  },
  async removeContact(token, id){
    const u = await this._auth(token);
    const i = db.contacts.findIndex(c=>c.id===id && c.userId===u.id);
    if(i<0){ audit(`user #${u.id}`,`DELETE /contacts/${id} not owner`,"deny"); throw new ApiError(403,"Not allowed"); }
    db.contacts.splice(i,1);
    audit(`user #${u.id}`,`DELETE /contacts/${id}`,"allow","DELETE FROM trusted_contacts WHERE id = ? AND user_id = ?");
  },
  async relayAlert(helperAnon, beaconId, ciphertext, helperLoc, alertRef){
    await sleep(300);
    const owner = db.users.find(x=>x.beaconIds && x.beaconIds.includes(beaconId));
    if(!owner){ audit(`helper ${helperAnon}`,"RELAY unknown beacon, dropped","deny"); throw new ApiError(404,"Unknown beacon"); }
    let a = db.alerts.find(x=>x.id===alertRef);
    if(!a){ a = {id:alertRef, userId:owner.id, at:Date.now(), status:"active", lat:helperLoc.lat, lng:helperLoc.lng, via:"relay", sightings:[]}; db.alerts.push(a); }
    a.sightings = a.sightings || [];
    a.sightings.push({t:Date.now(), helper:helperAnon, lat:helperLoc.lat, lng:helperLoc.lng, rssi:helperLoc.rssi});
    audit(`helper ${helperAnon} (anonymous)`,`RELAY beacon ${beaconId.slice(0,6)}… for ${alertRef}: helper GPS + signal strength stored, helper identity not stored`,"warn",
      "INSERT INTO relay_sightings (alert_ref, lat, lng, rssi, seen_at) VALUES (?, ?, ?, ?, ?)  -- no helper user_id column");
    return {ok:true};
  },
  async createAlert(token, a){
    const u = await this._auth(token);
    if(db.alerts.some(x=>x.id===a.id)){ audit(`user #${u.id}`,`POST /alerts ${a.id}: already received via helper relay, merged`,"allow","UPDATE alerts SET synced_direct = 1 WHERE ref = ? AND user_id = ?"); return; }
    db.alerts.push({...a, userId:u.id, serverAt:Date.now()});
    audit(`user #${u.id}`,`POST /alerts ${a.id}`,"allow","INSERT INTO alerts (ref, user_id, activated_at, lat, lng, status) VALUES (?, ?, ?, ?, ?, 'active')");
  },
  async emergencyAlert(deviceKey, a){
    const u = db.users.find(x=>x.deviceKey===deviceKey);
    if(!u) throw new ApiError(401,"Unknown device");
    if(db.alerts.some(x=>x.id===a.id)){ audit(`device of user #${u.id}`,`POST /alerts/emergency ${a.id}: already received via helper relay, merged`,"allow"); return; }
    db.alerts.push({...a, userId:u.id, serverAt:Date.now()});
    audit(`device of user #${u.id}`,`POST /alerts/emergency ${a.id} (device key, no login needed)`,"allow","INSERT INTO alerts (ref, user_id, activated_at, lat, lng, status) VALUES (?, ?, ?, ?, ?, 'active')");
  },
  async listAlerts(token){
    const u = await this._auth(token);
    audit(`user #${u.id}`,"GET /alerts","allow","SELECT ref, activated_at, status FROM alerts WHERE user_id = ? ORDER BY activated_at DESC");
    return db.alerts.filter(a=>a.userId===u.id);
  },
  async getAlert(token, ref){
    let u;
    try{ u = await this._auth(token); }catch(e){ audit("anonymous",`GET /alerts/${ref} with no token`,"deny"); throw e; }
    const a = db.alerts.find(x=>x.id===ref);
    audit(`user #${u.id}`,`GET /alerts/${ref}`, (a && a.userId===u.id)?"allow":"deny","SELECT * FROM alerts WHERE ref = ? AND user_id = ?");
    if(!a || a.userId!==u.id) throw new ApiError(403,"You do not have access to this alert.");
    return a;
  },
  async cancelAlert(token, deviceKey, ref, pin){
    let u = null;
    if(token){ u = await this._auth(token); } else { u = db.users.find(x=>x.deviceKey===deviceKey); }
    const a = db.alerts.find(x=>x.id===ref && x.userId===u?.id);
    if(!u) throw new ApiError(401,"Not allowed");
    const fwd = await hashPassword(pin, u.pinSalt);
    const rev = await hashPassword(pin.split("").reverse().join(""), u.pinSalt);
    if(ctEqual(fwd.hash,u.pinHash)){
      if(a) a.status="cancelled";
      audit(`user #${u.id}`,`CANCEL ${ref} with safe PIN`,"allow","UPDATE alerts SET status = 'cancelled' WHERE ref = ? AND user_id = ?");
      return "cancelled";
    }
    if(ctEqual(rev.hash,u.pinHash)){
      if(a) a.status="duress";
      audit(`user #${u.id}`,`DURESS PIN on ${ref}: phone shows "cancelled", alert stays ACTIVE and contacts are told`,"warn","UPDATE alerts SET status = 'duress' WHERE ref = ? AND user_id = ?");
      return "duress";
    }
    audit(`user #${u.id}`,`CANCEL ${ref} wrong PIN`,"deny");
    throw new ApiError(401,"Wrong PIN.");
  },
  async storeEvidence(frame){
    db.evidence.push(frame);
    audit(`device of user #${frame.userId}`,`EVIDENCE ${frame.id} stored (write-once; no delete permission exists)`,"warn",
      "INSERT INTO evidence_frames (id, alert_ref, user_id, captured_at, media_ref) VALUES (?, ?, ?, ?, ?)  -- table grants INSERT only");
    renderInspector();
  },
  async deleteEvidence(){
    audit("any caller","DELETE evidence attempted","deny","-- refused: evidence_frames has no DELETE grant for any role");

  },
  async createLiveShare(token, s){

  async listCounsellors(token){

  async counsellorQueue(token){
    const u = await this._auth(token);

    audit(`counsellor #${u.id}`,`PATCH /requests/${reqId}: accepted`,"allow","UPDATE support_requests SET status = 'accepted' WHERE id = ? AND counsellor_id = ?");

  async listCommunity(token){

};

/* ---------- device-side encrypted queue (real AES-GCM) ---------- */
let deviceKeyAES;
const queue = []; // {ref, iv, ct}
async function enqueue(alert){
  const iv = rand(12);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, deviceKeyAES, enc.encode(JSON.stringify(alert)));
  queue.push({ref:alert.id, iv:b64(iv), ct:b64(ct), raw:{iv,ct}});
  renderInspector();
}
async function flushQueue(){
  while(queue.length){
    const q = queue.shift();
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:q.raw.iv}, deviceKeyAES, q.raw.ct);
    const alert = JSON.parse(dec.decode(plain));
    try{
      if(S.session) await api.createAlert(S.session.token, alert);
      else await api.emergencyAlert(S.device.key, alert);
    }catch(e){ queue.unshift(q); break; }
    const local = S.alerts.find(a=>a.id===alert.id);
    if(local){
      local.synced = true;
      local.recipients.forEach(r=>{ if(r.state==="queued" || r.state==="sms-sent" || r.state==="relayed") deliver(local, r); });
      local.log.push({t:Date.now(), m:"Back online: encrypted alert sent to TechNov server"});
    }
  }
  renderInspector(); render();
}

/* ---------- Helper network (simulated Bluetooth relay) ----------
   Real build: Bluetooth Low Energy advertising/scanning in the native app.
   Distance from signal strength (RSSI): d = 10^((TxPower - RSSI) / (10 * n)), TxPower = -59 dBm at 1 m, n = 2.2 (urban). */
const H = { count:3, optIn:true, list:[], truePos:{lat:-25.7461, lng:28.1881}, timer:null };
const mPerLat = 111000, mPerLng = 100500; // metres per degree at Pretoria's latitude
const rssiToM = r => Math.pow(10, (-59 - r) / 22);
function spawnHelpers(){
  H.list = [];
  for(let i=0;i<H.count;i++){
    const ang = Math.random()*Math.PI*2, dist = 6 + Math.random()*35;              // metres from the person
    const lat = H.truePos.lat + Math.sin(ang)*dist/mPerLat, lng = H.truePos.lng + Math.cos(ang)*dist/mPerLng;
    const rssi = Math.round(-59 - 22*Math.log10(dist) + (Math.random()*4-2));        // what the helper's radio would measure
    H.list.push({anon:hex(rand(2)), lat, lng, rssi, signal: i<2, est: rssiToM(rssi)});
  }
  renderInspector();
}
function estimateFrom(helpers){
  // Weighted centroid: closer helpers (stronger signal) count more. Weight = 1 / distance².
  let W=0, lat=0, lng=0, spread=0;
  helpers.forEach(h=>{ const w = 1/Math.max(1,h.est)**2; W+=w; lat+=h.lat*w; lng+=h.lng*w; spread+=h.est*w; });
  return {lat:lat/W, lng:lng/W, acc:Math.round(spread/W + 8)};
}
async function relayViaHelpers(alert, payload){
  if(!S.beacon){ return; }
  alert.log.push({t:Date.now(), m:`Broadcasting encrypted Bluetooth SOS beacon (ID ${S.beacon.id.slice(0,6)}…)`}); render();
  await sleep(900);
  if(!H.list.length){
    alert.log.push({t:Date.now(), m:"No TechNov phones nearby. Alert stays encrypted on this phone and keeps broadcasting."});
    alert.beacon = "searching"; render(); return;
  }
  alert.log.push({t:Date.now(), m:`Beacon heard by ${H.list.length} nearby TechNov phone${H.list.length>1?"s":""}`});
  const relayers = H.list.filter(h=>h.signal);
  if(!relayers.length){ alert.log.push({t:Date.now(), m:"Nearby phones heard you but have no signal. They will forward it when they reconnect."}); render(); return; }
  const iv = rand(12);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, deviceKeyAES, enc.encode(JSON.stringify(payload)));
  alert.beaconCt = b64(ct);
  for(const h of relayers) await api.relayAlert(h.anon, S.beacon.id, alert.beaconCt, h, alert.id);
  const est = estimateFrom(relayers);
  alert.loc = {...est, place:`Estimated from ${relayers.length} nearby phones`, kind:"helper", ts:Date.now(), n:relayers.length};
  alert.trail = [{t:Date.now(), lat:est.lat, lng:est.lng, acc:est.acc, n:relayers.length}];
  alert.relayed = true; alert.beacon = "relayed";
  alert.recipients.forEach(r=>{ if(r.state==="queued") r.state = "relayed"; });
  alert.log.push({t:Date.now(), m:`Server received the alert through ${relayers.length} helper phone${relayers.length>1?"s":""}. Location estimated ±${est.acc} m. Contacts notified (simulated).`});
  render(); startTrail(alert);
}
function startTrail(alert){
  clearInterval(H.timer);
  H.timer = setInterval(async ()=>{
    if(alert.status!=="active" || S.net!=="none" || !H.count){ clearInterval(H.timer); return; }
    // The person keeps moving; new strangers' phones come in and out of range.
    H.truePos = {lat:H.truePos.lat + 0.00005 + (Math.random()-0.5)*0.00004, lng:H.truePos.lng + 0.00016 + (Math.random()-0.5)*0.00005};
    spawnHelpers();
    const relayers = H.list.filter(h=>h.signal);
    for(const h of relayers) await api.relayAlert(h.anon, S.beacon.id, alert.beaconCt, h, alert.id);
    const est = estimateFrom(relayers);
    const prev = alert.trail[alert.trail.length-1];
    const moved = Math.round(Math.hypot((est.lat-prev.lat)*mPerLat, (est.lng-prev.lng)*mPerLng));
    alert.trail.push({t:Date.now(), lat:est.lat, lng:est.lng, acc:est.acc, n:relayers.length});
    alert.loc = {...est, place:`Estimated from ${relayers.length} nearby phones`, kind:"helper", ts:Date.now(), n:relayers.length};
    alert.log.push({t:Date.now(), m:`New sighting by ${relayers.length} other helper phones: moved ~${moved} m since last point`});
    render();
  }, 7000);
}

function mmss(ms){ ms=Math.max(0,ms); const s=Math.round(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
const DANGER_ZONES = [

];
function zoneAt(lat,lng){ for(const z of DANGER_ZONES){ if(Math.hypot((lat-z.lat)*111000,(lng-z.lng)*100500)<=z.r) return z; } return null; }

}
function evalCalc(str){
  const t=String(str).match(/(\d+\.?\d*|[+\-*/%])/g); if(!t) return 0;
  let terms=[parseFloat(t[0])||0];
  for(let i=1;i<t.length;i+=2){ const op=t[i], n=parseFloat(t[i+1]); if(n===undefined||isNaN(n)) break;
    if(op==="*") terms[terms.length-1]*=n; else if(op==="/") terms[terms.length-1]/=n; else if(op==="%") terms[terms.length-1]%=n; else terms.push(op==="-"?-n:n); }
  return Math.round(terms.reduce((a,b)=>a+b,0)*1e8)/1e8;
}
let ringTimer, ringCtx, fakeTimer;
function startRing(){
  try{ navigator.vibrate && navigator.vibrate([600,300,600,300,600]); }catch(_){}
  try{
    ringCtx = ringCtx || new (window.AudioContext||window.webkitAudioContext)();
    const beep=()=>{ const o=ringCtx.createOscillator(), g=ringCtx.createGain(); o.type="sine"; o.frequency.value=480; o.connect(g); g.connect(ringCtx.destination); g.gain.setValueAtTime(0.0001,ringCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.13,ringCtx.currentTime+0.05); g.gain.exponentialRampToValueAtTime(0.0001,ringCtx.currentTime+0.55); o.start(); o.stop(ringCtx.currentTime+0.6); };
    beep(); clearInterval(ringTimer); ringTimer=setInterval(beep,1600);
  }catch(_){}
}
function stopRing(){ clearInterval(ringTimer); try{ navigator.vibrate && navigator.vibrate(0); }catch(_){} }
function handleGen(){ const a=["Brave","Kind","Quiet","Hopeful","Strong","Gentle","Caring","Steady"]; const n=["Protea","Springbok","Aloe","Jacaranda","Impala","Kudu","Sunbird","Marula"]; return a[Math.floor(Math.random()*a.length)]+" "+n[Math.floor(Math.random()*n.length)]; }
function timeAgo(t){ const s=Math.floor((Date.now()-t)/1000); if(s<60) return "just now"; const m=Math.floor(s/60); if(m<60) return m+" min ago"; const h=Math.floor(m/60); if(h<24) return h+" h ago"; const d=Math.floor(h/24); return d+" day"+(d>1?"s":"")+" ago"; }

/* ---------- SOS workflow ---------- */
const SAMPLE_LOC = {lat:-25.7461, lng:28.1881, place:"Church Square area, Pretoria", acc:18};
function newRef(){ const d=new Date(); return "TN-"+d.toISOString().slice(0,10).replace(/-/g,"")+"-"+String(rand(2)[0]*39+rand(1)[0]).padStart(4,"0").slice(-4); }

async function triggerSOS(){
  const contacts = (S.session ? S.contacts : S.device.contacts).filter(c=>c.alerts);
  const now = Date.now();
  const offline = S.net!=="online";
  const alert = {
    id:newRef(), at:now, status:"active",
    loc: S.net==="none"
      ? {...SAMPLE_LOC, kind:"last", ts: now-14*60000}
      : {...SAMPLE_LOC, kind:"current", ts: now},
    recording:"simulated",
    recipients: contacts.map(c=>({name:c.name, phone:c.phone, method:c.method, state:"created"})),
    services:"none", log:[{t:now, m:"SOS activated on this phone"}], synced:false, trail:[], relayed:false, beacon:null
  };
  S.alerts.unshift(alert); S.activeRef = alert.id; go("status");
  const payload = {id:alert.id, at:alert.at, status:"active", lat:alert.loc.lat, lng:alert.loc.lng};

  if(S.net==="online"){
    try{
      await sleep(500);
      if(S.session) await api.createAlert(S.session.token, payload); else await api.emergencyAlert(S.device.key, payload);
      alert.synced = true; alert.log.push({t:Date.now(), m:"Alert saved on TechNov server over HTTPS"});
      alert.recipients.forEach(r=>deliver(alert, r));
    }catch(e){
      await enqueue(payload); alert.recipients.forEach(r=>r.state="queued");
      alert.log.push({t:Date.now(), m:"Server unreachable: alert encrypted and queued"});
    }
  } else if(S.net==="cell"){
    await enqueue(payload);
    alert.log.push({t:Date.now(), m:"No internet: alert encrypted and queued for the server"});
    alert.recipients.forEach(r=>{ r.state = r.method==="SMS" ? "sms-sent" : "queued"; });
    alert.log.push({t:Date.now(), m:"SMS fallback used for SMS contacts (simulated)"});
  } else {
    await enqueue(payload);
    alert.recipients.forEach(r=>r.state="queued");
    alert.log.push({t:Date.now(), m:"No signal: alert stored encrypted on phone. Last known location attached."});
    render();
    H.truePos = {lat:SAMPLE_LOC.lat, lng:SAMPLE_LOC.lng}; spawnHelpers();
    await relayViaHelpers(alert, payload);
  }
  render();
}
function deliver(alert, r){
  r.state = "sent"; render();
  setTimeout(()=>{ if(S.net==="online"){ r.state = "delivered"; render(); } }, 1600);
}

function mapSVG(){

  <rect x="152" y="68" width="40" height="22" fill="color-mix(in srgb,var(--ok) 25%,transparent)"/>
  ${mapMarks(arguments[0]||{})}
  <text x="10" y="172" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--muted)">SAMPLE · not your real location</text></svg>`;

function mapMarks(o){
  o = o || {};
  const {trail=[], helpers=[], lastKnown=false} = o;
  // 0.8 px per metre, centred on the sample point
  const X = lng => Math.min(352, Math.max(8, 100 + (lng-SAMPLE_LOC.lng)*mPerLng*0.8));
  const Y = lat => Math.min(160, Math.max(8, 110 - (lat-SAMPLE_LOC.lat)*mPerLat*0.8));
  if(o.zones){
    return DANGER_ZONES.map(z=>{ const col = z.level==="high"?"var(--sos)":"var(--warn)"; const r = Math.min(70, z.r*0.14); return `<circle cx="${X(z.lng).toFixed(1)}" cy="${Y(z.lat).toFixed(1)}" r="${r.toFixed(1)}" fill="color-mix(in srgb,${col} 20%,transparent)" stroke="${col}" stroke-width="1.5"/>`; }).join("")
      + `<circle cx="172" cy="80" r="6.5" fill="var(--brand)" stroke="var(--surface)" stroke-width="3"/><text x="180" y="78" font-family="IBM Plex Mono,monospace" font-size="9" fill="var(--muted)">you</text>`;
  }
  if(o.pois){
    return `<circle cx="172" cy="80" r="6.5" fill="var(--brand)" stroke="var(--surface)" stroke-width="3"/><text x="180" y="78" font-family="IBM Plex Mono,monospace" font-size="9" fill="var(--muted)">you</text>
      <rect x="112" y="52" width="11" height="11" rx="2" fill="var(--sos)"/><text x="104" y="48" font-family="IBM Plex Mono,monospace" font-size="9" fill="var(--muted)">SAPS</text>
      <rect x="244" y="110" width="11" height="11" rx="2" fill="var(--ok)"/><text x="226" y="106" font-family="IBM Plex Mono,monospace" font-size="9" fill="var(--muted)">Hospital</text>`;
  }
  if(!trail.length){
    return `<circle cx="172" cy="80" r="26" fill="color-mix(in srgb,var(--sos) 15%,transparent)"/>
      <circle cx="172" cy="80" r="7" fill="var(--sos)" stroke="var(--surface)" stroke-width="3"/>
      ${helpers.map(h=>`<circle cx="${172+(h.lng-SAMPLE_LOC.lng)*mPerLng*0.8}" cy="${80-(h.lat-SAMPLE_LOC.lat)*mPerLat*0.8}" r="4.5" fill="var(--brand)" opacity=".75"/>`).join("")}`;
  }
  const last = trail[trail.length-1];
  const pts = trail.map(p=>`${X(p.lng).toFixed(1)},${Y(p.lat).toFixed(1)}`).join(" ");
  return `
    ${lastKnown?`<rect x="${X(SAMPLE_LOC.lng)-5}" y="${Y(SAMPLE_LOC.lat)-5}" width="10" height="10" fill="none" stroke="var(--muted)" stroke-width="2"/>
      <text x="${X(SAMPLE_LOC.lng)-6}" y="${Y(SAMPLE_LOC.lat)+18}" font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--muted)">last GPS</text>`:""}
    ${trail.length>1?`<polyline points="${pts}" fill="none" stroke="var(--sos)" stroke-width="2.5" stroke-dasharray="5 4"/>`:""}
    ${trail.slice(0,-1).map(p=>`<circle cx="${X(p.lng)}" cy="${Y(p.lat)}" r="3.5" fill="var(--sos)" opacity=".55"/>`).join("")}
    ${helpers.map(h=>`<circle cx="${X(h.lng)}" cy="${Y(h.lat)}" r="4.5" fill="${h.signal?"var(--brand)":"var(--muted)"}" opacity=".85"/>`).join("")}
    <circle cx="${X(last.lng)}" cy="${Y(last.lat)}" r="${Math.max(8,last.acc*0.8)}" fill="color-mix(in srgb,var(--sos) 15%,transparent)"/>
    <circle cx="${X(last.lng)}" cy="${Y(last.lat)}" r="6.5" fill="var(--sos)" stroke="var(--surface)" stroke-width="3"/>`;
}

/* ---------- render ---------- */
function render(){
  const scr = $("screen");
  const keep = {}; scr.querySelectorAll("input").forEach(i=>{ if(i.id) keep[i.id] = i.type==="checkbox"? i.checked : i.value; });
  const active = document.activeElement && scr.contains(document.activeElement) ? document.activeElement.id : null;
  scr.innerHTML = (S.tamper ? tamperHTML() : (screens[S.screen]?.() || "")) + sheetHTML() + (S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:"");
  scr.querySelectorAll("input").forEach(i=>{ if(i.id in keep && !S.err.__reset){ if(i.type==="checkbox") i.checked = keep[i.id]; else if(i.dataset.live!=="pw") i.value = keep[i.id]; } });
  if(active){ const el=$(active); if(el){ el.focus(); if(el.setSelectionRange && el.type!=="email") try{ el.setSelectionRange(el.value.length, el.value.length);}catch(_){} } }
  const n = {online:["","Online"],cell:["cell","No data · SMS"],none:["none","No signal"]}[S.net];
  $("netbar").innerHTML = `<span class="dot ${n[0]}"></span>${n[1]}`;
  if(S.screen==="history") loadHistory();
  if(S.screen && S.screen.indexOf("console")===0) loadConsole();
  if(S.screen==="counsellors") loadCounsellors();
  if(S.screen==="community") loadCommunity();
}

    } else if(role==="counsellor"){

    } else if(role==="dpo"){

      const pb = $("cons-priv");

async function loadHistory(){
  const box = $("histlist"); if(!box || loadHistory.busy) return; loadHistory.busy = true;
  let rows = [];
  try{
    if(S.net!=="online") throw new Error("offline");
    rows = await api.listAlerts(S.session.token);
  }catch(e){ loadHistory.busy = false; if(e.status===401) return expire(); rows = []; }
  loadHistory.busy = false;
  const local = S.alerts.filter(a=>!a.synced);
  const all = [...local.map(a=>({id:a.id, at:a.at, status:"queued on phone"})), ...rows.map(r=>({id:r.id, at:r.at, status:r.status==="duress"?"cancelled":r.status}))]
    .filter((v,i,arr)=>arr.findIndex(x=>x.id===v.id)===i);
  const b = $("histlist"); if(!b) return;
  b.innerHTML = all.length ? all.map(a=>`<div class="item"><div><div class="t" style="font-family:var(--f-mono);font-size:13px">${esc(a.id)}</div><div class="s">${fmtDate(a.at)} · ${SAMPLE_LOC.place.split(",")[1]}</div></div><span class="tag ${a.status==="active"?"crit":a.status==="cancelled"?"ok":"warn"}">${esc(a.status)}</span></div>`).join("")
    : `<div class="item"><span class="s">${S.net!=="online"?"You're offline. History loads when you reconnect.":"No alerts yet."}</span></div>`;
}

  const eb = $("evidencebox");

    ? `<div class="tbl"><table><thead><tr><th>id</th><th>alert</th><th>captured</th><th>state</th></tr></thead><tbody>${db.evidence.map(f=>`<tr><td>${f.id}</td><td>${esc(f.ref||"–")}</td><td>${fmtTime(f.t)}</td><td>on server · locked</td></tr>`).join("")}</tbody></table></div>`
    : `<p>Empty. Trigger Theft Lock on the phone (wrong PIN ×3, or the Simulate theft button) to capture evidence.</p>`;
  const ht = $("helpertbl");
  if(ht) ht.innerHTML = H.list.length
    ? `<table><thead><tr><th>anon id</th><th>RSSI</th><th>est. distance</th><th>true distance</th><th>signal</th></tr></thead><tbody>${
        H.list.map(h=>`<tr><td>helper·${h.anon}</td><td>${h.rssi} dBm</td><td>${h.est.toFixed(1)} m</td><td>${Math.hypot((h.lat-H.truePos.lat)*mPerLat,(h.lng-H.truePos.lng)*mPerLng).toFixed(1)} m</td><td>${h.signal?"yes · can relay":"no · store & forward"}</td></tr>`).join("")}</tbody></table>`
    : `<table><tbody><tr><td>No TechNov phones in Bluetooth range.</td></tr></tbody></table>`;
  renderSession(); renderBeacon();
}
function renderBeacon(){
  const b = $("beaconbox"); if(!b) return;
  if(!S.beacon){ b.innerHTML = `<dt>Your beacon</dt><dd>Created after first sign-in on this phone</dd>`; return; }
  const left = Math.max(0, Math.ceil((BEACON_ROTATE_MS-(Date.now()-S.beacon.since))/1000));
  b.innerHTML = `<dt>Your beacon ID</dt><dd style="font-family:var(--f-mono);font-size:12px">${S.beacon.id.slice(0,12)}…</dd>
    <dt>Rotates in</dt><dd style="font-family:var(--f-mono)">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</dd>
    <dt>Distance formula</dt><dd style="font-family:var(--f-mono);font-size:12px">d = 10^((−59 − RSSI) / 22)</dd>
    <dt>Position</dt><dd>Weighted average of helper GPS, weight = 1 / d²</dd>`;
}
function renderSession(){
  const box = $("sessbox"); if(!box) return;
  if(!S.session){ box.innerHTML = `<dt>Status</dt><dd>Signed out${S.device.configured?" · Emergency SOS enabled on this phone":""}</dd>`; return; }
  const s = db.sessions[S.session.token];
  const left = s ? Math.max(0, Math.ceil((SESSION_IDLE_MS-(Date.now()-s.last))/1000)) : 0;
  box.innerHTML = `<dt>User</dt><dd>${esc(S.session.user.email)} (${S.session.user.role})</dd>
    <dt>Token</dt><dd style="font-family:var(--f-mono);font-size:12px">${S.session.token.slice(0,8)}…${S.session.token.slice(-6)} (256-bit)</dd>
    <dt>Idle sign-out in</dt><dd style="font-family:var(--f-mono)">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</dd>`;
}
function expire(){
  S.session = null; S.contacts = []; S.sheet = null;
  go("login"); toast("You were signed out after 3 minutes without activity.");
}

  async calc(d){
    const map={div:"÷",mul:"×",sub:"−"}; const disp = map[d.v] || d.v;
    if(disp==="C"){ S.calc="0"; render(); return; }
    if(disp==="±"){ S.calc = (S.calc && S.calc[0]==="-") ? S.calc.slice(1) : ("-"+(S.calc==="0"?"":S.calc)); render(); return; }
    if(disp==="="){
      const entry = S.calc;
      if(S.session && /^-?\d{4}$/.test(entry)){ const u=db.users.find(x=>x.id===S.session.user.id); const h=await hashPassword(entry.replace("-",""), u.pinSalt); if(ctEqual(h.hash, u.pinHash)){ S.calc="0"; go("home"); toast("Welcome back."); return; } }
      try{ S.calc = String(evalCalc(entry)); }catch(_){ S.calc="Error"; }
      render(); return;
    }
    const opChar = {"÷":"/","×":"*","−":"-","+":"+","%":"%"}[disp];
    const c = (S.calc==="0"||S.calc==="Error") ? "" : S.calc;
    S.calc = c + (opChar || disp); render();
  },

/* ---------- Theft Lock (anti-theft evidence mode) ---------- */
async function enterTamper(reason){
  if(S.tamper) return;
  if(!S.device.userId && !S.session){ toast("Sign in on the phone first so there is an account to protect."); return; }
  S.tamper = {since:Date.now(), reason, attempts:0};
  const a = S.alerts.find(x=>x.status==="active");
  if(a){ a.log.push({t:Date.now(), m:`Theft Lock triggered: ${reason}. Phone locked, alert kept active.`}); render(); }
  else { await triggerSOS(); }            // creates and sends an active alert, then render() shows the lock
  audit(`device of user #${S.device.userId}`,`THEFT LOCK on: ${reason}`,"warn","UPDATE alerts SET theft_lock = 1 WHERE user_id = ? AND status = 'active'");
  await captureFrame();
  clearInterval(tamperTimer); tamperTimer = setInterval(captureFrame, 4000);
  render();
}
async function captureFrame(){
  if(!S.tamper) return;
  const a = S.alerts.find(x=>x.status==="active");
  const frame = {id:"EV"+String(db.evidence.length+1).padStart(3,"0"), userId:S.device.userId, ref:a?a.id:null, t:Date.now(), kind:S.tamper.reason};
  await api.storeEvidence(frame);
  render();
}
async function exitTamper(){
  clearInterval(tamperTimer);
  const a = S.alerts.find(x=>x.status==="active");
  const n = db.evidence.filter(f=>f.userId===S.device.userId).length;
  if(a) a.log.push({t:Date.now(), m:`Phone unlocked with Safe PIN. ${n} evidence frame${n!==1?"s":""} remain stored on the server.`});
  audit(`user #${S.device.userId}`,"THEFT LOCK cleared with correct Safe PIN","allow");
  S.tamper = null; S.sheet = null; S.pin = ""; S.pinTries = 0;
  go(S.session ? "home" : "welcome"); toast("Unlocked. The evidence already uploaded stays on the server.");
}
async function submitTamperPin(){
  const u = db.users.find(x=>x.id===S.device.userId);
  const fwd = await hashPassword(S.pin, u.pinSalt);
  if(ctEqual(fwd.hash, u.pinHash)){ await exitTamper(); return; }
  S.pin = ""; S.tamper.attempts++; S.err.pin = "Wrong PIN. This attempt was recorded as evidence.";
  render(); await captureFrame();
}

}
function tamperHTML(){
  const el = Math.floor((Date.now()-S.tamper.since)/1000);
  const u = db.users.find(x=>x.id===S.device.userId);
  const frames = db.evidence.filter(f=>f.userId===S.device.userId);

  </div>`;
}

async function submitPin(){
  if(S.tamper){ return submitTamperPin(); }
  const a = S.alerts.find(x=>x.id===S.activeRef);
  try{
    const res = await api.cancelAlert(S.session?.token, S.device.key, a.id, S.pin);
    a.status = res;
    S.sheet = null; S.pin = "";
    if(res==="cancelled"){
      a.log.push({t:Date.now(), m:"Cancelled with Safe PIN. Contacts told you are safe (simulated)."});
    } else {
      // The phone looks identical to a normal cancel; the truth is only on the server.
      a.log.push({t:Date.now(), m:"Cancelled with Safe PIN. Contacts told you are safe (simulated)."});
    }
    render();
  }catch(e){
    S.pinTries++; S.pin = "";
    if(S.pinTries>=3){ S.sheet=null; S.pinTries=0; render(); enterTamper("3 wrong PIN attempts"); return; }
    S.err.pin = "Wrong PIN. Try again.";
    render();
  }
}

const BEACON_ROTATE_MS = 15*60*1000;
function rotateBeacon(u){
  // A fresh random ID; the server keeps the current and previous one so in-flight relays still match.
  S.beacon = {id:hex(rand(16)), since:Date.now()};
  u.beaconIds = [...(u.beaconIds||[]).slice(-1), S.beacon.id];
  audit(`user #${u.id}`,"Bluetooth beacon ID rotated","allow","UPDATE beacon_ids SET current_id = ?, previous_id = current_id WHERE user_id = ?");
}
async function afterLogin(r){
  S.session = r; S.err = {}; S.bgResult = null;
  if(r.user.role!=="user"){
    // Staff accounts are routed into their backend console, with only their role's privileges.
    S.contacts = [];
    go(r.user.role==="admin" ? "consoleAdmin" : r.user.role==="responder" ? "consoleResponder" : r.user.role==="counsellor" ? "consoleCounsellor" : "consoleDpo");
    renderInspector();
    return;
  }
  if(!S.device.key) S.device.key = hex(rand(16));
  const u = db.users.find(x=>x.id===r.user.id);
  if(!u.deviceKey) u.deviceKey = S.device.key;
  if(!S.beacon || S.device.userId!==u.id) rotateBeacon(u);
  S.device.configured = true; S.device.userId = r.user.id;
  S.contacts = (await api.listContacts(r.token)).map(c=>({...c}));
  S.device.contacts = S.contacts.map(c=>({...c}));
  go("home"); renderInspector();
  try{ if(window.__pwaLoginHint) window.__pwaLoginHint(); }catch(_){}
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el || el.disabled) return;
  e.preventDefault();
  if(S.session){ const s = db.sessions[S.session.token]; if(s) s.last = Date.now(); }
  actions[el.dataset.act]?.(el.dataset, el);
});
document.addEventListener("input", e=>{
  if(e.target.dataset.live==="pw"){
    S.regPw = e.target.value;
    const pw = S.regPw, rules = [[pw.length>=8,"8+ characters"],[/[A-Z]/.test(pw),"Uppercase letter"],[/\d/.test(pw),"Number"],[/[^A-Za-z0-9]/.test(pw),"Symbol"]];
    const c = $("pwchecks"); if(c) c.innerHTML = rules.map(r=>`<span class="${r[0]?"on":""}">${r[0]?"✓":"○"} ${r[1]}</span>`).join("");
  }
});
document.addEventListener("submit", async e=>{
  e.preventDefault();
  const id = e.target.id, v = k => ($(k)?.value || "").trim();
  if(id==="f-register"){
    const name=v("r-name"), email=v("r-email").toLowerCase(), pw=$("r-pw").value, pw2=$("r-pw2").value, pin=v("r-pin");
    let msg = "";
    if(name.length<2) msg = "Enter your full name.";
    else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) msg = "Enter a valid email address.";
    else if(!(pw.length>=8 && /[A-Z]/.test(pw) && /\d/.test(pw) && /[^A-Za-z0-9]/.test(pw))) msg = "Your password needs all four items in the checklist.";
    else if(pw!==pw2) msg = "The two passwords do not match.";
    else if(!/^\d{4}$/.test(pin)) msg = "Your Safe PIN must be exactly 4 digits.";
    else if(pin===pin.split("").reverse().join("")) msg = "Pick a PIN that reads differently backwards, like 1357.";
    else if(!$("r-consent").checked) msg = "Please accept the privacy notice to continue.";
    if(msg){ S.err.register = msg; render(); return; }
    await api.register({name,email,password:pw,pin});
    S.pendingEmail = email; S.regPw = ""; go("verify");
  }
  if(id==="f-verify"){
    try{ await api.verify(S.pendingEmail, v("v-code")); go("login"); toast("Email verified. You can sign in now."); const le=$("l-email"); if(le) le.value=S.pendingEmail; }
    catch(err){ S.err.verify = err.message; render(); }
  }
  if(id==="f-login"){
    const btn = $("l-submit"); if(btn){ btn.disabled = true; btn.textContent = "Checking…"; }
    try{ const r = await api.login(v("l-email"), $("l-pw").value); await afterLogin(r); }
    catch(err){ S.err.login = err.message; render(); const p=$("l-pw"); if(p) p.value=""; }
  }
  if(id==="f-contact"){
    const name=v("c-name"), phone=v("c-phone").replace(/\s/g,""), rel=v("c-rel")||"Contact", method=$("c-method").value;
    if(name.length<2){ S.err.contact="Enter the contact's name."; render(); return; }
    if(!/^(\+27|0)[6-8]\d{8}$/.test(phone)){ S.err.contact="Enter a South African mobile number, like 072 123 4567."; render(); return; }
    try{
      const row = await api.addContact(S.session.token, {name, phone, relationship:rel, method, alerts:true});
      S.contacts.push({...row}); S.device.contacts = S.contacts.map(x=>({...x}));
      S.err = {}; e.target.reset(); render(); toast(`${name} will receive your alerts.`);
    }catch(err){ if(err.status===401) expire(); }
  }
  if(id==="f-walk"){
    const dur = +$("w-dur").value, note = v("w-note");
    S.walk = {endsAt:Date.now()+dur*60000, duration:dur, note, startedAt:Date.now(), notify:$("w-notify").checked};
    const on = S.contacts.filter(c=>c.alerts).map(c=>c.name);
    go("safewalk");
    toast(S.walk.notify && on.length ? `Told ${on.join(", ")} you're walking to ${note||"your destination"}.` : "Safe walk started.");
    return;
  }
  if(id==="f-live"){
    const cid = $("lv-contact").value, dur = +$("lv-dur").value, c = S.contacts.find(x=>x.id===cid);
    const token = hex(rand(8));
    try{ await api.createLiveShare(S.session.token, {contactId:cid, minutes:dur, token}); }catch(err){ if(err.status===401) return expire(); }
    S.live = {contactName:c?c.name:"your contact", endsAt:Date.now()+dur*60000, token};
    go("livelocation"); toast(`Sharing your live location with ${c?c.name:"your contact"}.`);
    return;
  }
  if(id==="f-couns"){
    const note = v("cr-note"), anon = $("cr-anon").checked;
    try{ await api.requestCounsellor(S.session.token, S.reqCounsellor, note, anon); go("counsellors"); toast("Your request was sent. They'll reach out soon."); }
    catch(err){ if(err.status===401) return expire(); toast(err.message); }
    return;
  }
  if(id==="f-post"){
    const text = v("po-text"), topic = $("po-topic").value;
    if(text.length<3){ toast("Write a little more before posting."); return; }
    try{ await api.postCommunity(S.session.token, {topic, text}); e.target.reset(); render(); toast("Posted anonymously."); }
    catch(err){ if(err.status===401) return expire(); }
    return;
  }
  if(id==="f-reply"){
    const text = v("rp-text");
    if(text.length<2){ toast("Write a short reply first."); return; }
    try{ await api.replyCommunity(S.session.token, S.thread, text); render(); toast("Reply added."); }
    catch(err){ if(err.status===401) return expire(); }
    return;
  }
});
